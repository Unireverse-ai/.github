<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">How an Unireverse engagement runs</title>
<desc id="d">Animated chain of five stages: Understand (AI Opportunity Audit), Assess (value assessment), Build (sales-to-production AI), Accept (acceptance and handover), Operate (managed AI operations). A pulse travels through each stage and measured results loop back to the next workflow.</desc>
<rect width="1200" height="480" rx="22" fill="#F4F3EF"/>
<text x="60" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="19" letter-spacing="2" fill="#191918">ENGAGEMENT CHAIN</text><text x="1140" y="64" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#8A8984">every stage leaves evidence you can inspect</text>
<line x1="120" y1="175" x2="1080" y2="175" stroke="#DDDBD4" stroke-width="3"/>
<line x1="120" y1="175" x2="1080" y2="175" stroke="#191918" stroke-width="3" stroke-dasharray="960 960" stroke-dashoffset="960"><animate attributeName="stroke-dashoffset" values="960;0;0;960" keyTimes="0;0.7;0.97;1" dur="10.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.7799999999999999;0.8999999999999999;1" dur="10.0s" repeatCount="indefinite"/></line>
<path d="M1080 317 C1080 437 120 437 120 317" fill="none" stroke="#B9B7B0" stroke-width="1.5" stroke-dasharray="3 8"/>
<circle r="3" fill="#8A8984"><animateMotion dur="7s" begin="0.00s" repeatCount="indefinite" path="M1080 317 C1080 437 120 437 120 317"/></circle>
<circle r="3" fill="#8A8984"><animateMotion dur="7s" begin="-1.17s" repeatCount="indefinite" path="M1080 317 C1080 437 120 437 120 317"/></circle>
<circle r="3" fill="#8A8984"><animateMotion dur="7s" begin="-2.33s" repeatCount="indefinite" path="M1080 317 C1080 437 120 437 120 317"/></circle>
<circle r="3" fill="#8A8984"><animateMotion dur="7s" begin="-3.50s" repeatCount="indefinite" path="M1080 317 C1080 437 120 437 120 317"/></circle>
<circle r="3" fill="#8A8984"><animateMotion dur="7s" begin="-4.67s" repeatCount="indefinite" path="M1080 317 C1080 437 120 437 120 317"/></circle>
<circle r="3" fill="#8A8984"><animateMotion dur="7s" begin="-5.83s" repeatCount="indefinite" path="M1080 317 C1080 437 120 437 120 317"/></circle>
<rect x="380.0" y="395" width="440" height="38" rx="19" fill="#F4F3EF"/><text x="600.0" y="417" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#8A8984">measured results scope the next workflow</text>
<circle cx="120" cy="175" r="30" fill="#F4F3EF" stroke="#191918" stroke-width="2"/><text x="120" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#191918">01</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.1;0.13;1" dur="10.0s" repeatCount="indefinite"/><circle cx="120" cy="175" r="30" fill="#191918"/><text x="120" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#F4F3EF">01</text></g>
<text x="120" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#191918">Understand</text><text x="120" y="281" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="0.5" fill="#8A8984">AI OPPORTUNITY AUDIT</text><circle cx="360" cy="175" r="30" fill="#F4F3EF" stroke="#191918" stroke-width="2"/><text x="360" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#191918">02</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.175;0.275;0.305;1" dur="10.0s" repeatCount="indefinite"/><circle cx="360" cy="175" r="30" fill="#191918"/><text x="360" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#F4F3EF">02</text></g>
<text x="360" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#191918">Assess</text><text x="360" y="281" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="0.5" fill="#8A8984">VALUE ASSESSMENT</text><circle cx="600" cy="175" r="30" fill="#F4F3EF" stroke="#191918" stroke-width="2"/><text x="600" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#191918">03</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.345;0.35;0.45;0.48;1" dur="10.0s" repeatCount="indefinite"/><circle cx="600" cy="175" r="30" fill="#191918"/><text x="600" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#F4F3EF">03</text></g>
<text x="600" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#191918">Build</text><text x="600" y="281" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="0.5" fill="#8A8984">SALES-TO-PRODUCTION AI</text><circle cx="840" cy="175" r="30" fill="#F4F3EF" stroke="#191918" stroke-width="2"/><text x="840" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#191918">04</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.525;0.625;0.655;1" dur="10.0s" repeatCount="indefinite"/><circle cx="840" cy="175" r="30" fill="#191918"/><text x="840" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#F4F3EF">04</text></g>
<text x="840" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#191918">Accept</text><text x="840" y="281" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="0.5" fill="#8A8984">ACCEPTANCE &amp; HANDOVER</text><circle cx="1080" cy="175" r="30" fill="#F4F3EF" stroke="#191918" stroke-width="2"/><text x="1080" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#191918">05</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.695;0.7;0.8;0.83;1" dur="10.0s" repeatCount="indefinite"/><circle cx="1080" cy="175" r="30" fill="#191918"/><text x="1080" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#F4F3EF">05</text></g>
<text x="1080" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#191918">Operate</text><text x="1080" y="281" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="0.5" fill="#8A8984">MANAGED AI OPERATIONS</text><circle r="15" fill="#191918" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M120 175 L1080 175" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0.14;0.14;0;0" keyTimes="0;0.7;0.73;1" dur="10.0s" repeatCount="indefinite"/></circle>
<circle r="7" fill="#191918" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M120 175 L1080 175" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.7;0.73;1" dur="10.0s" repeatCount="indefinite"/></circle>
